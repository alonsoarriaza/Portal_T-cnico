server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: portal-abaxial-backend
  profiles:
    active: dev
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portal_abaxial}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 250MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970357336763979244226452948404D6351}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:1800000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
  storage:
    type: local
    local-path: ${STORAGE_PATH:./storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://172.25.2.140:5173,http://172.25.2.140}
  security:
    initial-admin:
      username: ${INITIAL_ADMIN_USERNAME:admin}
      password: ${INITIAL_ADMIN_PASSWORD:AdminAbaxial2026!}
      email: ${INITIAL_ADMIN_EMAIL:admin@abaxial.es}
      nombre: "Super"
      apellidos: "Administrador"
